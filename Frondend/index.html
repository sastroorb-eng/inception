<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-smk.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16273e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121a27" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Terapkan tema tersimpan sebelum paint pertama agar tidak kedip.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="AskTunas — portal informasi resmi dan layanan informasi SMK Telekomunikasi Tunas Harapan, Tengaran, Kabupaten Semarang."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AskTunas" />
    <meta property="og:title" content="AskTunas · SMK Telekomunikasi Tunas Harapan" />
    <meta
      property="og:description"
      content="Portal cerdas sekolah: profil, 4 program keahlian, galeri, pendaftaran PPDB, dan layanan informasi SMK Telekomunikasi Tunas Harapan."
    />
    <meta property="og:image" content="https://www.tunasharapan.info/official/wp-content/uploads/2022/03/logo_smk_ok-copy.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <title>AskTunas · SMK Telekomunikasi Tunas Harapan</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
